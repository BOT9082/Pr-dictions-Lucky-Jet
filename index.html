<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Lucky Jet Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* CSS DÉBUT */
        :root {
            --primary-color: #00e6e6; /* Cyan pour l'effet lumineux */
            --secondary-color: #f0f0f0; /* Blanc pour le texte principal */
            --background-color: #121212; /* Noir très sombre */
            --border-color: #333333; /* Gris foncé pour les bordures */
            --error-color: #e65252; /* Rouge doux pour les erreurs */
        }
        
        body {
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--secondary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background-color: #1d1d1d;
            border: 1px solid var(--border-color);
            border-top: 5px solid var(--primary-color);
            padding: 40px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 230, 230, 0.1);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 28px;
            color: var(--primary-color);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 230, 230, 0.5);
            letter-spacing: 2px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid var(--border-color);
            background-color: var(--background-color);
            color: var(--secondary-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 230, 230, 0.5);
        }

        input::placeholder {
            color: #555555;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--primary-color);
            background-color: var(--primary-color);
            color: var(--background-color);
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
        }

        button:hover {
            background-color: transparent;
            color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 230, 230, 0.5);
        }

        .message {
            font-size: 14px;
            margin-top: 15px;
        }

        .error {
            color: var(--error-color);
        }

        .success {
            color: var(--primary-color);
        }

        .links {
            margin-top: 25px;
        }

        .links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .links a:hover {
            text-decoration: none;
            text-shadow: 0 0 10px var(--primary-color);
        }
        /* CSS FIN */
    </style>
</head>
<body>
    <div class="login-card">
        <h1>ACCESS POINT</h1>
        <input id="user-id" placeholder="IDENTIFIANT" spellcheck="false" autocomplete="off">
        <input id="password" placeholder="MOT DE PASSE" type="password" spellcheck="false" autocomplete="off">
        <button onclick="handleLogin()">AUTHENTIFIER</button>
        <p class="message" id="message"></p>
        <div class="links">
            <a href="https://t.me/BIGWIN2257375527" target="_blank">PROBLÈMES D'ACCÈS ?</a>
        </div>
    </div>

    <script>
        // Votre code JS inchangé ici
        async function handleLogin() {
            const userId = document.getElementById('user-id').value.trim();
            const password = document.getElementById('password').value.trim();
            const message = document.getElementById('message');

            message.textContent = '';
            message.className = 'message';

            if (!userId || !password) {
                message.textContent = 'ERREUR : VEUILLEZ COMPLÉTER LES CHAMPS.';
                message.classList.add('error');
                return;
            }

            try {
                const response = await fetch('data/users.txt');
                if (!response.ok) throw new Error("Impossible de charger users.txt");
                const data = await response.text();
                const users = data.split('\n')
                    .map(line => line.trim())
                    .filter(line => line && !line.startsWith('#'))
                    .map(line => line.split('|').map(field => field.trim()));

                const userMatch = users.find(user => user[0] === userId && user[2] === password);

                if (userMatch) {
                    message.textContent = 'ACCÈS AUTORISÉ. REDIRECTION...';
                    message.classList.add('success');
                    localStorage.setItem('luckyjet_user', userId);
                    setTimeout(() => {
                        window.location.href = 'predictions.html?user=' + encodeURIComponent(userId);
                    }, 1200);
                } else {
                    message.textContent = 'IDENTIFIANT OU MOT DE PASSE INCORRECT.';
                    message.classList.add('error');
                }
            } catch (error) {
                message.textContent = 'ERREUR : IMPOSSIBLE DE VÉRIFIER.';
                message.classList.add('error');
            }
        }
    </script>
</body>
</html>
