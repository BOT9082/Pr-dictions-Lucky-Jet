<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - Lucky Jet Predictor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 20px }

    .login-box {
      background: #1e293b;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,.4);
      text-align: center;
      width: 320px;
    }

    input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
      box-shadow: 0 2px 8px #3b82f6a0;
      transform: scale(1.03);
      transition: all .2s;
    }

    .error-msg {
      color: #ef4444;
      margin: 8px 0 0 0;
      font-size: 15px;
      min-height: 22px;
      transition: opacity .3s;
      opacity: 0;
    }
    .error-msg.visible {
      opacity: 1;
    }

    /* Chat */
    .cat {
      position: relative;
      width: 150px;
      height: 140px;
      margin: 0 auto 20px;
      animation: breathe 4s ease-in-out infinite;
      filter: drop-shadow(0 6px 12px #0008);
    }

    /* Tête */
    .head {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 150px;
      height: 130px;
      background: radial-gradient(ellipse at 60% 40%, #f1c27d 70%, #e0a96d 100%);
      border-radius: 50% 50% 45% 45%;
      box-shadow: 0 2px 16px #0003, inset -4px -6px #e0a96d, 0 0 0 8px #e7c8a340, 0 0 0 4px #c89b6a;
      border: 2px solid #c89b6a;
      position: relative;
    }
    .head::before {
      content: "";
      position: absolute;
      left: -10px; top: -10px; right: -10px; bottom: -10px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, #f1c27d 0 2px, #e7c8a3 2px 4px, transparent 4px 10px);
      opacity: .13;
      pointer-events: none;
      z-index: 1;
    }
    .head::after {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0; bottom: 0;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 40% 30%, #fff6 0 18px, #f8d7a6 40px, transparent 70px);
      box-shadow: 0 0 18px 6px #f8d7a6 inset;
      opacity: .22;
      z-index: 2;
    }

    /* Blush/joues */
    .cat .cheek {
      position: absolute;
      top: 90px;
      width: 22px;
      height: 12px;
      background: radial-gradient(circle, #ffb6b6 60%, #fff0 100%);
      border-radius: 50%;
      opacity: .35;
      z-index: 3;
    }
    .cat .cheek.left { left: 18px; }
    .cat .cheek.right { right: 18px; }

    /* Oreilles */
    .ear {
      position: absolute;
      top: -30px;
      width: 0;
      height: 0;
      border-left: 30px solid transparent;
      border-right: 30px solid transparent;
      border-bottom: 40px solid;
      border-image: linear-gradient(to bottom, #f1c27d 70%, #e0a96d 100%) 1;
      box-shadow: 0 2px 8px #0002, 0 0 0 4px #c89b6a40;
      background: linear-gradient(to bottom, #f1c27d 80%, #e0a96d 100%);
    }
    .ear.left { left: 10px; transform: rotate(-8deg); }
    .ear.right { right: 10px; transform: rotate(8deg); }
    .ear::after {
      content: "";
      position: absolute;
      top: 6px;
      left: -20px;
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 25px solid;
      border-image: linear-gradient(to bottom, #f8d7a6 80%, #e0a96d 100%) 1;
      opacity: .8;
      background: linear-gradient(to bottom, #f8d7a6 80%, #e0a96d 100%);
    }

    /* Yeux */
    .eye {
      position: absolute;
      top: 55px;
      width: 24px;
      height: 28px;
      border: 2px solid #222;
      box-shadow: 0 0 12px #0008, 0 2px 8px #fff2 inset;
      background: radial-gradient(circle at 60% 40%, #222 80%, #111 100%);
    }
    .eye.left { left: 40px; }
    .eye.right { right: 40px; }
    .pupil {
      position: absolute;
      top: 6px; left: 6px;
      width: 12px; height: 14px;
      background: radial-gradient(circle at 60% 40%, #fff 70%, #bbb 100%);
      border-radius: 50%;
      transition: transform .25s;
      box-shadow: 0 0 8px #fff8, 0 0 0 2px #b00a;
      position: relative;
    }
    .pupil.red {
      background: radial-gradient(circle at 60% 40%, #ff4d4d 60%, #b00 90%, #400 100%);
      box-shadow: 0 0 12px 2px #ff4d4d88, 0 0 0 2px #b00a;
      /* Ajout d'un reflet lumineux dans l'œil rouge */
      position: relative;
    }
    .pupil.red::before {
      content: "";
      position: absolute;
      left: 3px; top: 3px;
      width: 5px; height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      opacity: .7;
      filter: blur(1px);
      z-index: 2;
    }
    .pupil::after {
      content: "";
      position: absolute;
      top: 2px; left: 2px;
      width: 6px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      opacity: .7;
      filter: blur(1px);
    }
    .eye.left::before, .eye.right::before {
      content: "";
      position: absolute;
      top: 18px; left: 7px;
      width: 8px; height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      transform: rotate(-18deg);
      filter: blur(1px);
    }
    /* Fermeture des yeux */
    .cat.closed .eye {
      transform: scaleY(0.1);
    }
    /* Yeux cachés, pas fermés */
    .cat.hide-eyes .eye {
      transform: scale(0.1, 0.1);
      opacity: 0;
    }
    .cat.hide-eyes .head,
    .cat.hide-eyes .ear,
    .cat.hide-eyes .cheek,
    .cat.hide-eyes .nose,
    .cat.hide-eyes .mouth,
    .cat.hide-eyes .whisker {
      opacity: 0.1;
    }


    /* Nez */
    .nose {
      position: absolute;
      top: 85px;
      left: 0; right: 0;
      margin: auto;
      width: 18px;
      height: 14px;
      box-shadow: 0 2px 6px #e39aa3a0, 0 0 0 2px #c97a8a, 0 0 8px #fff6 inset;
      background: radial-gradient(ellipse at 60% 40%, #e39aa3 70%, #c97a8a 100%);
      border-radius: 50% 50% 60% 60%;
    }

    /* Bouche */
    .mouth {
      position: absolute;
      top: 102px;
      left: 50%;
      width: 40px;
      height: 20px;
      border-bottom: 3px solid #e39aa3;
      box-shadow: 0 2px 6px #e39aa3a0, 0 0 8px #fff6 inset;
      border-radius: 0 0 50% 50%;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, #fff0 70%, #e39aa3 100%);
    }
    .mouth.smile {
      height: 32px;
      border-bottom: 5px solid #b00;
      border-radius: 0 0 80% 80%;
      background: linear-gradient(to bottom, #fff0 60%, #b00 100%);
      box-shadow: 0 4px 12px #b00a, 0 0 0 2px #800 inset;
      transition: all .3s;
      position: relative;
      transform: translateX(-50%) rotate(12deg) scaleX(1.1);
      /* Effet glossy */
      overflow: hidden;
    }
    .mouth.smile::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 6px;
      width: 18px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(90deg, #fff6 60%, #fff0 100%);
      opacity: .5;
      pointer-events: none;
    }
    .mouth.smile::before {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 2px;
      height: 8px;
      border-radius: 0 0 80% 80%;
      background: linear-gradient(to top, #b00a 60%, #fff0 100%);
      opacity: .25;
      pointer-events: none;
    }

    /* Moustaches */
    .whisker {
      position: absolute;
      top: 90px;
      width: 50px;
      height: 2px;
      background: #e7c8a3;
      box-shadow: 0 0 4px #e7c8a3a0;
      opacity: .85;
    }
    .w1 { left: -40px; transform: rotate(8deg); }
    .w2 { left: -40px; top: 98px; transform: rotate(-8deg); }
    .w3 { right: -40px; transform: rotate(-8deg); }
    .w4 { right: -40px; top: 98px; transform: rotate(8deg); }

    /* Effet de poils autour de la tête */
    .head::before {
      content: "";
      position: absolute;
      left: -8px; top: -8px; right: -8px; bottom: -8px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, #f1c27d 0 2px, #e7c8a3 2px 4px, transparent 4px 8px);
      opacity: .09;
      pointer-events: none;
    }

    /* Respiration */
    @keyframes breathe {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* Placeholder animé pour le mot de passe */
    input[type="password"]::placeholder {
      color: #e39aa3;
      font-style: italic;
      transition: color .3s;
    }
    input[type="password"]:focus::placeholder {
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Connexion</h1>
  <div class="login-box">
    <div class="cat" id="chat">
      <div class="head"></div>
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="eye left"><div class="pupil" id="pupilL"></div></div>
      <div class="eye right"><div class="pupil" id="pupilR"></div></div>
      <div class="cheek left"></div>
      <div class="cheek right"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
      <div class="whisker w1"></div>
      <div class="whisker w2"></div>
      <div class="whisker w3"></div>
      <div class="whisker w4"></div>
    </div>
    <label for="username" style="text-align:left;display:block;font-size:15px;">Identifiant</label>
    <input type="text" id="username" placeholder="Identifiant" autocomplete="username">
    <label for="password" style="text-align:left;display:block;font-size:15px;">Mot de passe</label>
    <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="loginBtn">Se connecter</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const user = document.getElementById('username');
    const pass = document.getElementById('password');
    const pupilL = document.getElementById('pupilL');
    const pupilR = document.getElementById('pupilR');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const mouth = document.querySelector('.mouth');

    const updatePupils = () => {
      const value = user.value;
      if (!value) {
        pupilL.style.transform = "translateY(6px)";
        pupilR.style.transform = "translateY(6px)";
        pupilL.style.background = "radial-gradient(circle at 60% 40%, #fff 70%, #bbb 100%)";
        pupilR.style.background = "radial-gradient(circle at 60% 40%, #fff 70%, #bbb 100%)";
        return;
      }
      const pos = user.selectionStart || 0;
      let dx = 0;
      if (pos < value.length / 3) dx = -4;
      else if (pos > value.length * 2 / 3) dx = 4;
      pupilL.style.transform = `translate(${dx}px, 2px)`;
      pupilR.style.transform = `translate(${dx}px, 2px)`;
      pupilL.style.background = "radial-gradient(circle at 60% 40%, #fff 70%, #bbb 100%)";
      pupilR.style.background = "radial-gradient(circle at 60% 40%, #fff 70%, #bbb 100%)";
    };

    user.addEventListener('focus', () => {
      chat.classList.remove('closed');
      updatePupils();
    });

    pass.addEventListener('focus', () => {
      chat.classList.add('closed');
    });

    pass.addEventListener('blur', () => {
      chat.classList.remove('closed');
      pupilL.style.transform = "translateY(0)";
      pupilR.style.transform = "translateY(0)";
    });
    
    user.addEventListener('input', () => {
      errorMsg.textContent = "";
      errorMsg.classList.remove('visible');
      updatePupils();
      if (user.value.trim().length > 0) {
        pupilL.style.transform = "translateY(0)";
        pupilR.style.transform = "translateY(0)";
        pupilL.classList.add('red');
        pupilR.classList.add('red');
        mouth.classList.remove('smile');
      } else {
        pupilL.classList.remove('red');
        pupilR.classList.remove('red');
        mouth.classList.remove('smile');
      }
    });

    pass.addEventListener('input', () => {
      errorMsg.textContent = "";
      errorMsg.classList.remove('visible');
    });

    user.addEventListener('blur', () => {
      pupilL.style.transform = "translateY(0)";
      pupilR.style.transform = "translateY(0)";
      pupilL.classList.remove('red');
      pupilR.classList.remove('red');
      mouth.classList.remove('smile');
    });

    loginBtn.addEventListener('click', async () => {
      const userId = user.value.trim();
      const password = pass.value.trim();
      chat.classList.remove('closed', 'wink');
     
      if (!userId || !password) {
        errorMsg.textContent = "Veuillez remplir tous les champs.";
        errorMsg.classList.add('visible');
        pupilL.classList.remove('red');
        pupilR.classList.remove('red');
        return;
      }

      try {
        const response = await fetch('data/users.txt');
        if (!response.ok) throw new Error("Impossible de charger users.txt");
        const data = await response.text();
        const users = data.split('\n')
          .map(line => line.trim())
          .filter(line => line && !line.startsWith('#'))
          .map(line => line.split('|').map(field => field.trim()));

        const userMatch = users.find(u => u[0] === userId && u[2] === password);

        if (userMatch) {
          errorMsg.textContent = "Connexion réussie ! Redirection...";
          errorMsg.style.color = '#2ecc71';
          errorMsg.classList.add('visible');
          // Chat content
          chat.classList.add('wink');
          pupilL.classList.remove('red');
          pupilR.classList.remove('red');
          mouth.classList.add('smile');

          localStorage.setItem('luckyjet_user', userId);
          setTimeout(() => {
            window.location.href = 'predictions.html?user=' + encodeURIComponent(userId);
          }, 1200);
        } else {
          errorMsg.textContent = "Identifiant ou mot de passe incorrect.";
          errorMsg.style.color = '#ef4444';
          errorMsg.classList.add('visible');
          // Chat triste
          pupilL.classList.add('red');
          pupilR.classList.add('red');
          mouth.classList.remove('smile');
        }
      } catch (error) {
        errorMsg.textContent = "Erreur lors de la vérification.";
        errorMsg.style.color = '#ef4444';
        errorMsg.classList.add('visible');
      }
    });
  </script>
</body>
</html>
