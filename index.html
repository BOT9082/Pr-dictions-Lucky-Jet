<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Lucky Jet Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* CSS DÉBUT */
        :root {
            --bg-color: #1a1a1a;
            --card-color: #222222;
            --text-color: #f0f0f0;
            --primary-color: #007bff;
            --border-color: #444444;
            --error-color: #ff5c5c;
            --success-color: #4CAF50;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 40px;
            width: 350px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-color);
            margin-bottom: 30px;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            padding-right: 40px; /* Espace pour l'icône */
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: transparent;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        input::placeholder {
            color: #777;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--border-color);
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: var(--text-color);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .message {
            font-size: 14px;
            margin-top: 15px;
        }

        .error {
            color: var(--error-color);
        }

        .success {
            color: var(--success-color);
        }

        .links {
            margin-top: 25px;
        }

        .links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #0056b3;
        }
        /* CSS FIN */
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Connexion</h1>
        <div class="input-group">
            <input id="user-id" placeholder="Identifiant" spellcheck="false" autocomplete="off">
        </div>
        <div class="input-group">
            <input id="password" placeholder="Mot de passe" type="password" spellcheck="false" autocomplete="off">
            <span class="toggle-password" onclick="togglePassword()">👁️</span>
        </div>
        <button onclick="handleLogin()">Se connecter</button>
        <p class="message" id="message"></p>
        <div class="links">
            <a href="https://t.me/BIGWIN2257375527" target="_blank">Créer un compte / Besoin d'aide ?</a>
        </div>
    </div>

    <script>
        // Votre fonction de connexion, inchangée
        async function handleLogin() {
            const userId = document.getElementById('user-id').value.trim();
            const password = document.getElementById('password').value.trim();
            const message = document.getElementById('message');

            message.textContent = '';
            message.className = 'message';

            if (!userId || !password) {
                message.textContent = 'Veuillez remplir tous les champs.';
                message.classList.add('error');
                return;
            }

            try {
                const response = await fetch('data/users.txt');
                if (!response.ok) throw new Error("Impossible de charger users.txt");
                const data = await response.text();
                const users = data.split('\n')
                    .map(line => line.trim())
                    .filter(line => line && !line.startsWith('#'))
                    .map(line => line.split('|').map(field => field.trim()));

                const userMatch = users.find(user => user[0] === userId && user[2] === password);

                if (userMatch) {
                    message.textContent = 'Connexion réussie ! Redirection...';
                    message.classList.add('success');
                    localStorage.setItem('luckyjet_user', userId);
                    setTimeout(() => {
                        window.location.href = 'predictions.html?user=' + encodeURIComponent(userId);
                    }, 1200);
                } else {
                    message.textContent = 'Identifiant ou mot de passe incorrect.';
                    message.classList.add('error');
                }
            } catch (error) {
                message.textContent = 'Erreur lors de la vérification.';
                message.classList.add('error');
            }
        }
        
        // Nouvelle fonction pour afficher/masquer le mot de passe
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈'; // Œil barré
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️'; // Œil
            }
        }
    </script>
</body>
</html>
